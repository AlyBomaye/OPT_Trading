<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Opções Terminal">
  <!--
    WO-41 — Ícone da aba do navegador.

    O desenho é o PAYOFF DE UMA CALL: perda limitada e plana até o strike, joelho, e ganho
    subindo daí em diante. É o gráfico que identifica opções especificamente, não finanças em
    geral — um candle ou uma seta serviriam para qualquer corretora.

    Restrição real: isto é lido a 16×16. Por isso são dois traços grossos e uma linha de zero,
    e nada mais. A linha de zero não é enfeite: sem ela o traço vira um "visto" de checkbox;
    com ela, o cruzamento no breakeven aparece e a forma se lê como gráfico.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0e14"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="6.6" fill="none" stroke="#232a38" stroke-width="1.2"/>

  <!-- Linha do zero: o payoff cruza aqui, no ponto de empate. -->
  <line x1="5" y1="18" x2="27" y2="18" stroke="#2f3949" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Payoff: plano no prêmio pago, joelho no strike, alta sem teto. -->
  <path d="M5.5 23 L14 23 L26.5 7.5"
        fill="none" stroke="#22d3ee" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
